name: RedPulse Backend on Azure
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false
          
      - name: pnpm install and build
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          pnpm install
          pnpm --filter redpulse-types run build
          cd apps/api
          pnpm run build
          
      # Isolate ONLY the necessary files for production
      - name: Prepare Deployment Artifact
        run: |
          mkdir -p deploy_artifact
          # Copy the bundled output (assuming your bundler outputs to dist/)
          cp -r apps/api/dist/* deploy_artifact/
          # Copy package.json so Azure knows the start command (optional but recommended)
          cp apps/api/package.json deploy_artifact/
          
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: deploy_artifact/ # Upload ONLY the isolated API build
          
  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./deploy_artifact
          
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_30D3BB2692AE41F68B18D829E51534EA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_748836E5864043C8A74830D3E642F3A5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D68365EFC3CB46289C4F5613CA8ADE31 }}
          
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'redpulse'
          slot-name: 'Production'
          package: ./deploy_artifact # Deploy ONLY the isolated API build
