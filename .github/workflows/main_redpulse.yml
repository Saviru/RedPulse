name: RedPulse Backend on Azure
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          
      - name: Install and Build (NPM Workspaces)
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          # 1. Install all monorepo dependencies
          npm install
          
          # 2. Build the types and API using npm workspace flags
          npm run build --workspace=redpulse-types
          npm run build --workspace=redpulse-api
          
      - name: Isolate and Prepare Deployment Artifact
        run: |
          # 3. Create a clean folder for Azure
          mkdir -p deploy_artifact
          
          # 4. Copy ONLY the compiled output and package.json
          cp -r apps/api/dist deploy_artifact/
          cp apps/api/package.json deploy_artifact/
          
          # 5. Install ONLY production dependencies natively (no symlinks)
          cd deploy_artifact
          npm install --omit=dev --no-package-lock
          
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./deploy_artifact/ # Upload the clean, self-contained app

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./deploy_artifact
          
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_30D3BB2692AE41F68B18D829E51534EA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_748836E5864043C8A74830D3E642F3A5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D68365EFC3CB46289C4F5613CA8ADE31 }}
          
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'redpulse'
          slot-name: 'Production'
          package: ./deploy_artifact
