name: RedPulse Backend on Azure
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'
          
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9
          run_install: false
          
      - name: Build and Package Standalone API
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: |
          # 1. Build everything with pnpm to resolve internal dependencies
          pnpm install
          pnpm --filter redpulse-types run build
          pnpm --filter redpulse-api run build
          
          # 2. Prepare the artifact folder
          mkdir -p deploy_artifact
          cp -r apps/api/dist deploy_artifact/
          cp apps/api/package.json deploy_artifact/
          
          # 3. THE FIX: Remove all "workspace:" dependencies so npm can run
          # This small node script safely cleans package.json without breaking it
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('deploy_artifact/package.json', 'utf8'));
            if (pkg.dependencies) {
              Object.keys(pkg.dependencies).forEach(dep => {
                if (pkg.dependencies[dep].startsWith('workspace:')) delete pkg.dependencies[dep];
              });
            }
            fs.writeFileSync('deploy_artifact/package.json', JSON.stringify(pkg, null, 2));
          "
          
          # 4. Install production dependencies (Flat node_modules for Azure)
          cd deploy_artifact
          npm install --omit=dev --no-package-lock --legacy-peer-deps
          
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: ./deploy_artifact/ 

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: node-app
          path: ./deploy_artifact
          
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_30D3BB2692AE41F68B18D829E51534EA }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_748836E5864043C8A74830D3E642F3A5 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_D68365EFC3CB46289C4F5613CA8ADE31 }}
          
      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'redpulse'
          slot-name: 'Production'
          package: ./deploy_artifact
