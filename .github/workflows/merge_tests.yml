name: Test Before Merging PRs

on:
  pull_request: # Pre check
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }} # Terminate old workflows when there is a new commit in same PR
  cancel-in-progress: true
  
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    steps:
      - uses: actions/checkout@v4
      
      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
          
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Jest tests
        env:
          MONGODB_URI: mongodb://localhost:27017/test
          JWT_SECRET: test-secret-key-12345
        run: pnpm run test
