name: Generate RedPulse APK Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'pnpm'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Gradle Caching
        uses: gradle/actions/setup-gradle@v3

      - name: Build UI
        env:
          API_URL_SECRET: ${{ secrets.EXPO_PUBLIC_API_BASE_URL }}
        run: |
          # 1. Install dependencies and build shared packages
          pnpm install
          pnpm --filter redpulse-types run build
          
          # 2. Create the .env file for Expo
          echo "EXPO_PUBLIC_API_BASE_URL=$API_URL_SECRET" > .env
          
          # 3. Enter the android directory and build the APK
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --console=plain

      - name: Upload APK as Artifact (Backup)
        uses: actions/upload-artifact@v4
        with:
          name: RedPulse-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Create GitHub Release and Attach APK
        # Only runs if a tag triggered the workflow
        if: startsWith(github.ref, 'refs/tags/') 
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/release/app-release.apk
          name: RedPulse Release ${{ github.ref_name }}
          # Generates automatic release notes based on commit history
          generate_release_notes: true 
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}